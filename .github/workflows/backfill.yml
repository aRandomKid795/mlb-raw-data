name: Backfill MLB Archive

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-06-26"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        default: "2026-07-09"

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run backfill
        run: python backfill.py "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boxscores/
          git commit -m "Backfill boxscores ${{ github.event.inputs.start_date }} to ${{ github.event.inputs.end_date }}" || echo "No changes to commit"
          git push
